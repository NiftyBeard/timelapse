<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Old Nest (A tale of a Robin and her chicks)</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --accent1: #703030;
    --accent2: #563516;
    --accent3: #38380e;
    --accent4: #1a3519;
    --accent5: #012f25;
    --accent6: #00262c;
    --accent7: #0c1d28;
    --accent8: #14141e;
    --accent9: #100a10;
    --black:   #000000;
  }

  body {
    margin: 0;
    font-family: "Roboto", sans-serif;
    background: var(--accent6);
    color: #e0e0e0;
  }

  header {
    padding: 24px;
    text-align: center;
    background: var(--accent1);
    color: #e8e8e8;
    font-size: 1.8rem;
    font-weight: 500;
    border-bottom: 3px solid var(--accent2);
  }

  .container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
  }

  .section {
    background: var(--accent4);
    padding: 20px;
    border-radius: 10px;
    border: 1px solid var(--accent9);
    margin-bottom: 40px;
  }

  .section h2 {
    margin-top: 0;
    font-weight: 400;
    color: var(--black);
    font-size: 1.4rem;
  }

  .live-stream {
    width: 100%;
    border-radius: 8px;
    border: 2px solid var(--accent1);
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 20px;
  }

  .gallery-grid img {
    width: 100%;
    border-radius: 6px;
    border: 2px solid var(--accent2);
    transition: opacity 0.2s ease;
  }

  .gallery-grid img:hover {
    opacity: 0.8;
  }
</style>
</head>

<body>

<header>The Old Nest</header>

<div class="container">

  <section class="section">
    <h2>Live Stream (Over)</h2>
    <h3>Once upon a time there was a robin who nested on our front door. This is her tale</h3>
  </section>

  <section class="section">
    <h2>Timelapse Gallery</h2>
    <div id="gallery" class="gallery-grid"></div>
  </section>

</div>

<div id="player"></div>

<script>
const owner = "NiftyBeard";
const repo = "timelapse";
const path = "snapshots";

const player = document.getElementById("player");
const img = document.createElement("img");
img.style.width = "100%";
player.appendChild(img);

fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`)
  .then(r => r.json())
  .then(files => {
    // Filter JPGs
    let images = files
      .filter(f => f.name.endsWith(".jpg"))
      .sort((a, b) => a.name.localeCompare(b.name)); // ensure correct order

    // Preload
    const urls = images.map(f => f.download_url);
    let index = 0;

    function showNext() {
      img.src = urls[index];
      index = (index + 1) % urls.length; // loop forever
    }

    // Start playback at 10 FPS (adjust as needed)
    setInterval(showNext, 100);
  });
</script>
  
</body>
</html>
