<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Old Nest (A tale of a Robin and her chicks)</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --accent1: #703030;
    --accent2: #563516;
    --accent3: #38380e;
    --accent4: #1a3519;
    --accent5: #012f25;
    --accent6: #00262c;
    --accent7: #0c1d28;
    --accent8: #14141e;
    --accent9: #100a10;
    --black:   #000000;
  }

  body {
    margin: 0;
    font-family: "Roboto", sans-serif;
    background: var(--accent6);
    color: #e0e0e0;
  }

  header {
    padding: 24px;
    text-align: center;
    background: var(--accent1);
    color: #e8e8e8;
    font-size: 1.8rem;
    font-weight: 500;
    border-bottom: 3px solid var(--accent2);
  }

  .container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
  }

  .section {
    background: var(--accent4);
    padding: 20px;
    border-radius: 10px;
    border: 1px solid var(--accent9);
    margin-bottom: 40px;
  }

  .section h2 {
    margin-top: 0;
    font-weight: 400;
    color: var(--black);
    font-size: 1.4rem;
  }

  .live-stream {
    width: 100%;
    border-radius: 8px;
    border: 2px solid var(--accent1);
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 20px;
  }

  .gallery-grid img {
    width: 100%;
    border-radius: 6px;
    border: 2px solid var(--accent2);
    transition: opacity 0.2s ease;
  }

  .gallery-grid img:hover {
    opacity: 0.8;
  }
</style>
</head>

<body>

<header>The Old Nest</header>

<div class="container">

  <section class="section">
    <h2>Live Stream (Over)</h2>
    <h3>Once upon a time there was a robin who nested on our front door. This is her tale</h3>
  </section>

  <section class="section">
    <h2>Timelapse Gallery</h2>
    <div id="gallery" class="gallery-grid"></div>
  </section>

</div>

<div id="player"></div>

<style>
  #player-container {
    width: 100%;
    max-width: 800px;
    margin: auto;
    text-align: center;
    font-family: sans-serif;
  }

  #timelapse-img {
    width: 100%;
    border-radius: 6px;
    background: #000;
  }

  #controls {
    margin-top: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  #scrubber {
    width: 100%;
  }
</style>

<div id="player-container">
  <img id="timelapse-img" />

  <input type="range" id="scrubber" min="0" max="0" value="0">

  <div id="controls">
    <button id="play">Play</button>
    <button id="pause">Pause</button>

    <label>
      Speed:
      <select id="speed">
        <option value="50">20 FPS</option>
        <option value="100" selected>10 FPS</option>
        <option value="200">5 FPS</option>
        <option value="500">2 FPS</option>
      </select>
    </label>

    <button id="fullscreen">Fullscreen</button>
  </div>
</div>

<script>
const owner = "NiftyBeard";
const repo = "timelapse";
const path = "snapshots";

const container = document.getElementById("player-container");
const img = document.getElementById("timelapse-img");
const scrubber = document.getElementById("scrubber");
const playBtn = document.getElementById("play");
const pauseBtn = document.getElementById("pause");
const speedSelect = document.getElementById("speed");
const fullscreenBtn = document.getElementById("fullscreen");

let urls = [];
let index = 0;
let timer = null;

function startPlayback() {
  stopPlayback();
  timer = setInterval(nextFrame, Number(speedSelect.value));
}

function stopPlayback() {
  if (timer) clearInterval(timer);
  timer = null;
}

function nextFrame() {
  img.src = urls[index];
  scrubber.value = index;
  index = (index + 1) % urls.length;
}

function goToFrame(i) {
  index = i;
  img.src = urls[index];
}

playBtn.onclick = startPlayback;
pauseBtn.onclick = stopPlayback;

speedSelect.onchange = () => {
  if (timer) startPlayback();
};

scrubber.oninput = (e) => {
  stopPlayback();
  goToFrame(Number(e.target.value));
};

// --- FULLSCREEN HANDLER ---
fullscreenBtn.onclick = () => {
  if (!document.fullscreenElement) {
    container.requestFullscreen?.() || container.webkitRequestFullscreen?.();
  } else {
    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
  }
};

fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`)
  .then(r => r.json())
  .then(files => {
    urls = files
      .filter(f => f.name.endsWith(".jpg"))
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(f => f.download_url);

    scrubber.max = urls.length - 1;
    img.src = urls[0];
  });
</script>

  
</body>
</html>
